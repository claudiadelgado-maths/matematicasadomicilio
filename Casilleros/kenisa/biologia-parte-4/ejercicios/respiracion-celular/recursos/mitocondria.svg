<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-labelledby="mito-title mito-desc"><title id="mito-title">El recorrido de la glucosa en una célula eucariota</title><desc id="mito-desc">Uno: glucólisis en el citosol. Dos: oxidación del piruvato y tres: Krebs en la matriz. Cuatro: cadena y fosforilación oxidativa en la membrana interna.</desc><rect width="640" height="430" rx="35" fill="#f8eadc"/><text x="32" y="40" fill="#765844" font-size="17" font-family="sans-serif">CITOSOL · FUERA DE LA MITOCONDRIA</text><path d="M77 245C77 170 144 149 256 161S486 126 551 191S563 338 469 353S293 333 195 357S67 325 77 245Z" fill="#efb897" stroke="#af704f" stroke-width="5"/><path d="M106 245C110 191 133 185 174 189L189 263Q196 282 208 261L220 190L258 194L274 275Q280 294 293 274L305 191L345 191L360 269Q367 287 379 265L391 185L431 182L447 249Q455 269 466 248L481 177Q524 187 539 230Q558 302 497 319Q458 333 404 318T297 321T187 332Q108 339 106 245Z" fill="#fff5df" stroke="#b87857" stroke-width="5"/><text x="246" y="315" fill="#79583e" font-size="18" font-family="sans-serif">MATRIZ</text><path d="M154 94H216Q230 94 230 122V153" fill="none" stroke="#628f85" stroke-width="3" stroke-dasharray="6 5"/><path d="M223 144L230 154L237 144" fill="none" stroke="#628f85" stroke-width="3"/><g data-region="glucolisis"><circle cx="108" cy="93" r="29" fill="#a8d3c5" stroke="#376e68" stroke-width="3"/><text x="108" y="104" text-anchor="middle" font-size="31" font-family="sans-serif" fill="#173e47">1</text><text x="152" y="87" font-size="18" font-family="sans-serif" fill="#173e47">Glucosa → piruvatos</text></g><g data-region="piruvato"><circle cx="165" cy="275" r="27" fill="#dcd0ed" stroke="#8f71ab" stroke-width="3"/><text x="165" y="286" text-anchor="middle" font-size="29" font-family="sans-serif" fill="#173e47">2</text></g><g data-region="krebs"><circle cx="332" cy="254" r="30" fill="#d4e6a5" stroke="#899853" stroke-width="3"/><path d="M315 235Q336 221 350 242M346 233L351 242L341 242" fill="none" stroke="#5a702d" stroke-width="2"/><text x="332" y="267" text-anchor="middle" font-size="27" font-family="sans-serif" fill="#173e47">3</text></g><g data-region="cadena"><circle cx="487" cy="177" r="28" fill="#9ccdd7" stroke="#538796" stroke-width="3"/><text x="487" y="188" text-anchor="middle" font-size="29" font-family="sans-serif" fill="#173e47">4</text></g><path d="M489 145L508 108H594" fill="none" stroke="#538796" stroke-width="2"/><text x="420" y="76" font-size="16" font-family="sans-serif" fill="#375c67">Membrana interna</text><text x="420" y="96" font-size="15" font-family="sans-serif" fill="#375c67">con pliegues o crestas</text><g font-family="sans-serif" font-size="16" fill="#173e47"><text x="36" y="397">Nutrientes</text><text x="166" y="397">→ electrones</text><text x="324" y="397">→ gradiente de H⁺</text><text x="517" y="397">→ ATP</text></g></svg>