<title id="fungi-title">Un hongo con seta y su micelio</title><desc id="fungi-desc">La seta sobresale del sustrato; debajo hay una red de hifas. A la derecha se amplía una hifa para señalar la pared celular. Esporas visibles como puntos cerca del sombrero. Esquema sin escala.</desc>
