<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-labelledby="plant-title plant-desc">
<title id="plant-title">Una célula vegetal fotosintética</title><desc id="plant-desc">Pared externa, membrana interna, citoplasma, gran vacuola central, núcleo, cloroplastos, mitocondrias, ribosomas, retículo y Golgi. A la derecha se amplía un cloroplasto para mostrar la clorofila en sus membranas internas. Esquema sin escala.</desc>
