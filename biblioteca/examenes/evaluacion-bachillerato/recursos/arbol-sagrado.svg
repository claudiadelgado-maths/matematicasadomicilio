      <stop offset="0" stop-color="#795026"/>
      <stop offset=".45" stop-color="#b9853f"/>
      <stop offset="1" stop-color="#63401f"/>
    </linearGradient>
    <radialGradient id="leaf-a" cx="45%" cy="28%" r="72%">
      <stop offset="0" stop-color="#91c84b"/>
      <stop offset=".62" stop-color="#4f972c"/>
      <stop offset="1" stop-color="#2f681f"/>
    </radialGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#20341c" flood-opacity=".22"/>
    </filter>
  </defs>
