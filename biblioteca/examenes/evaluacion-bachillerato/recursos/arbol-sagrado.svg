  <title id="title">Árbol, distancia y ángulo de elevación</title>
  <desc id="desc">Un árbol vertical forma un triángulo rectángulo con el suelo y una línea de visión. La distancia horizontal es de 200 metros y el ángulo de elevación es de 60 grados.</desc>
